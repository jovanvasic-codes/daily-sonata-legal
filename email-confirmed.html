<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Sonata: you are all set</title>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 560px;
        margin: 0 auto;
        padding: 96px 20px 64px;
        color: #1c1813;
        line-height: 1.6;
        text-align: center;
      }
      h1 { font-size: 1.6rem; }
      .mark { font-size: 2.4rem; }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: center;
        margin: 1.2rem auto;
        max-width: 220px;
        color: #c8a86a;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-top: 1px solid #c8a86a;
        opacity: 0.6;
      }
      .muted { color: #6b6259; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="mark">&#127925;</div>
    <h1>You are all set</h1>
    <div class="divider">&#9679;</div>
    <p>
      Your request was confirmed. You can close this tab and return to the
      Daily Sonata app.
    </p>
    <p class="muted">
      If the app did not open by itself, open it from your home screen and sign
      in with your email and password.
    </p>
  </body>
</html>
